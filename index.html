<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Launcher</title>
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2d6a5a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workspace">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/alpine.min.js"></script>
</head>
<body>
  <!-- Dynamic Application DOM Mount Container -->
  <div id="app-root"></div>

  <!-- Loading/transition overlay. A sibling of #app-root, not a child — offline-first
       mounting replaces #app-root's innerHTML (see mountBundle()), and this needs to keep
       working as redirectToApp()'s "Opening…" state even after that's happened (e.g. a
       "Go live" tap from an already-mounted cached view). Visible by default so it also
       covers the very first pre-mount paint, same as before this moved out of #app-root. -->
  <div id="shell-loading" class="shell-loading-container">
    <div class="shell-spinner"></div>
    <div id="shell-loading-text" class="shell-loading-text">Loading application...</div>
  </div>

  <!-- Offline-first "Go live" banner: shown over the mounted cached bundle whenever a
       trusted GAS URL is on file and the browser is online. Sits outside #app-root so
       mountBundle() replacing #app-root's innerHTML never removes it. See
       showGoLiveBanner()/hideGoLiveBanner() in pwa.js. -->
  <a href="#" id="shell-golive-link" class="shell-live-banner is-hidden">Using cached copy · Go live</a>

  <!-- Background "Update ready" banner: shown once checkForFreshBundle() has silently pulled
       a newer bundles.json snapshot into the cache. Unlike "Go live" above, clicking this
       never navigates away — it just reloads to remount the already-cached fresh bundle. See
       checkForFreshBundle()/showUpdateBanner() in pwa.js. -->
  <a href="#" id="shell-update-link" class="shell-update-banner is-hidden">Update ready · Refresh</a>

  <!-- First-Run / Setup Connection Card -->
  <div id="config-modal" class="is-hidden">
    <div class="modal-card">
      <div class="card-badge">
        <svg class="badge-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h2 id="modal-title">Application Launcher</h2>
      <p id="modal-desc">Choose an app to launch:</p>

      <div id="app-picker" class="app-picker is-hidden"></div>

      <!-- Always-available manual fallback: a live tile tap can land on a Google
           account/org error page instead of the app (see launchKnownApp/redirectToApp in
           pwa.js), with no way for this page to detect that failure once navigation has
           happened. This link never depends on detecting failure — it just offers the last
           cached/offline bundle directly, shown whenever one exists for this app. -->
      <button type="button" id="use-offline-btn" class="shell-redirect-escape is-hidden">Use offline copy</button>

      <details id="custom-connect" class="custom-connect">
        <summary>Connect a different app</summary>
        <div class="input-group">
          <input
            type="url"
            id="gas-url-input"
            placeholder="https://script.google.com/macros/s/.../exec"
            autocomplete="off"
            spellcheck="false"
            required
          >
        </div>
        <div class="action-row">
          <button type="button" id="launch-btn" class="btn-primary">
            <span id="launch-btn-text">Launch Application</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </details>

      <div id="shell-error-msg" class="shell-error-text is-hidden"></div>

      <!-- Dev-mode launch link. Hidden unless localStorage carries the dev flag (set via
           ?dev=1 — see pwa.js). Not a security boundary: the GAS /dev URL is already
           gated server-side by Google IAM to script editors only. -->
      <button type="button" id="dev-launch-btn" class="shell-redirect-escape is-hidden">Launch /dev (testing)</button>

      <div class="privacy-footnote">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
        <span>Zero cloud storage. Bundle is cached directly in your browser.</span>
      </div>

      <!-- Human-readable build tag. Text is set at runtime from SHELL_VERSION (see
           version.js, loaded below) so it can never drift from sw.js's CACHE_NAME the way a
           second hardcoded literal here previously did. -->
      <div id="shell-version" class="shell-version"></div>
    </div>
  </div>

  <!-- Floating Install PWA Banner -->
  <div id="pwa-install-bar" class="is-hidden" role="button" tabindex="0" aria-label="Install Web Application">
    <span class="install-icon">📲</span>
    <span class="install-spinner" aria-hidden="true"></span>
    <span id="pwa-install-text">Install Application</span>
    <button type="button" id="pwa-dismiss-btn" aria-label="Dismiss banner">✕</button>
  </div>

  <script src="./version.js"></script>
  <script src="./pwa.js"></script>
</body>
</html>
