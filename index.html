<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Day Planner PWA</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2d6a5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <iframe id="app-frame" title="Day Planner Application"></iframe>

  <div id="config-modal" class="is-hidden">
    <div class="modal-box">
      <h2>📖 Connect GAS Day Planner</h2>
      <p>Enter your Google Apps Script Web App Executable URL below (e.g., <code>https://script.google.com/macros/s/.../exec</code>):</p>
      <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec">
      <button type="button" id="launch-btn">Launch Planner PWA</button>
    </div>
  </div>

  <div id="pwa-install-bar">
    <span>📲 Install Day Planner App</span>
  </div>

  <script src="./pwa.js"></script>
</body>
</html>
